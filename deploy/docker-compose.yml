# Onkel Bummel im LXC, eingerichtet von deploy/proxmox/create-lxc.sh. Tailscale läuft im LXC selbst,
# "tailscale serve" reicht die Anfragen an den Server weiter:
#   https://onkel-bummel.<tailnet>.ts.net        → 127.0.0.1:8080  App, API und Web-Oberfläche
#   https://onkel-bummel.<tailnet>.ts.net:9464   → 127.0.0.1:9464  nur /metrics für Prometheus
#
# Host-Netzwerk, damit der Server ausgehend das Tailnet samt MagicDNS nutzt (Identity-Server, Loki, Ziele
# von Actions). Er lauscht nur auf 127.0.0.1, aus dem LAN ist er also nicht erreichbar.
# Einstellungen stehen in /etc/onkel-bummel/onkel-bummel.env, nach Änderungen: docker compose up -d
name: onkel-bummel

services:
  onkel-bummel:
    build: ../backend
    image: onkel-bummel:latest
    restart: unless-stopped
    network_mode: host
    env_file: ${ONKEL_BUMMEL_ENV_FILE:-/etc/onkel-bummel/onkel-bummel.env}
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:8080;http://127.0.0.1:9464
      Server__UseForwardedHeaders: "true"
      TZ: Europe/Berlin
    volumes:
      # Datenbank und Anhänge; gehört dem Benutzer "app" (UID 1654) im Image
      - ${ONKEL_BUMMEL_DATA:-/var/lib/onkel-bummel}:/data
      # APNs-Schlüssel (apns.p8)
      - ${ONKEL_BUMMEL_SECRETS:-/etc/onkel-bummel/secrets}:/run/secrets:ro
