# Onkel Bummel im Heimnetz, erreichbar nur im Tailnet:
#   https://onkel-bummel.<tailnet>.ts.net        App, API und Web-Oberfläche
#   https://onkel-bummel.<tailnet>.ts.net:9464   nur /metrics für Prometheus
#
#   cp .env.example .env    # Werte eintragen
#   mkdir -p secrets && cp ~/Downloads/AuthKey_XXXXXXXXXX.p8 secrets/apns.p8
#   docker compose up -d --build
#
# Der Server teilt das Netzwerk des Tailscale-Containers: tailscale serve reicht die Anfragen an 127.0.0.1 weiter,
# und ausgehend erreicht der Server den Identity-Server, Loki und die Ziele von Actions über das Tailnet.
name: onkel-bummel

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: onkel-bummel
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: onkel-bummel
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Kernel-Modus statt Userspace, damit auch die Verbindungen des Servers ins Tailnet gehen
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      # Für den Zugriff aus dem Heimnetz ohne Tailscale, z. B. zum Testen; ohne Zeile nur im Tailnet
      - "127.0.0.1:${ONKEL_BUMMEL_LOCAL_PORT:-8080}:8080"

  onkel-bummel:
    build: ../backend
    image: onkel-bummel:latest
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      Server__PublicUrl: https://onkel-bummel.${TS_TAILNET:?TS_TAILNET fehlt in der .env}.ts.net
      Server__UseForwardedHeaders: "true"
      Oidc__Issuer: ${OIDC_ISSUER:?OIDC_ISSUER fehlt in der .env}
      Oidc__WebClientSecret: ${OIDC_WEB_CLIENT_SECRET:-}
      Apns__KeyPath: /run/secrets/apns.p8
      Apns__KeyId: ${APNS_KEY_ID:-}
      Apns__TeamId: ${APNS_TEAM_ID:-}
      Monitoring__Loki__Url: ${LOKI_URL:-}
      Monitoring__Loki__Host: ${MONITORING_HOST:-onkel-bummel}
      Backup__NextcloudWebDavUrl: ${NEXTCLOUD_WEBDAV_URL:-}
      Backup__NextcloudUserName: ${NEXTCLOUD_USERNAME:-}
      Backup__NextcloudAppPassword: ${NEXTCLOUD_APP_PASSWORD:-}
      Backup__Passphrase: ${BACKUP_PASSPHRASE:-}
      TZ: Europe/Berlin
    volumes:
      - data:/data
      # Ganzer Ordner statt einzelner Datei: fehlt apns.p8, legt Docker sonst ein Verzeichnis dieses Namens an
      - ./secrets:/run/secrets:ro

volumes:
  tailscale-state:
  data:
