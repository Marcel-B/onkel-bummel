# Xcode-Projekt für Onkel Bummel; erzeugen mit: cd ios && xcodegen
name: OnkelBummel
options:
  bundleIdPrefix: com.b-velop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
packages:
  OnkelBummelKit:
    path: OnkelBummelKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6GGU8ET2C4
    CODE_SIGN_STYLE: Automatic
targets:
  OnkelBummel:
    type: application
    platform: iOS
    sources: [OnkelBummel]
    dependencies:
      - package: OnkelBummelKit
      - target: NotificationService
    entitlements:
      path: OnkelBummel/OnkelBummel.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.b-velop.onkel-bummel]
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.b-velop.onkel-bummel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Onkel Bummel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Zum Scannen des QR-Codes mit der Server-Adresse.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Zum Sichern von Bildern aus Nachrichten.
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    dependencies:
      - package: OnkelBummelKit
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.b-velop.onkel-bummel]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Onkel Bummel
        # Must match the app, App Store Connect rejects the upload otherwise.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.b-velop.onkel-bummel.NotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OnkelBummel:
    build:
      targets:
        OnkelBummel: all
    run:
      config: Debug
    test:
      config: Debug
